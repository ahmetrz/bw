name: fetch-odds

# OddsPapi'den oran ceker ve data/ altina JSON yazar.
#
# ARTIK ANA VERI YOLU DEGIL. Betwinner icin fetch-betwinner.yml kullanilir: kitabin
# kendi feed'ini okur, anahtar istemez ve yaklasik iki kat market tasir. Bu workflow
# OddsPapi tarafini yeniden test etmek ya da iki kaynagi karsilastirmak icin duruyor.
#
# Once probe-odds ile istedigin kitabin kapsamda oldugunu DOGRULA. Kapsamda degilse bu
# workflow bos/400 doner ya da BASKA bir kitap dondurur.
#
# DOSYA ADI KURALI:
#   Cikti dosyasi ISTENEN slug'a gore degil, payload'da GERCEKTEN donen kitaba gore
#   adlandirilir. Sebep: 2026-07-25 probe'unda betwinner istendi, HTTP 200 dondu ama
#   icerik 22bet'ti; dosya yine de betwinner_34480.json diye kaydedildi. Bir dosya adi
#   asla tasimadigi kitabi vaat etmemeli (CLAUDE.md hard rule 5).
#
# KURULUM:
#   Secret: ODDSPAPI_KEY  (Settings > Secrets and variables > Actions)
#   Yol:    .github/workflows/fetch-odds.yml
#   Calistir: Actions > fetch-odds > Run workflow

on:
  workflow_dispatch:
    inputs:
      tournaments:
        description: "Turnuva ID(leri), virgulle: 34480 veya 34480,390,325"
        required: true
        default: "34480"
      book:
        description: "Bookmaker slug"
        required: false
        default: "betwinner"
  # Zamanlama KALDIRILDI. 6 saatlik cron her tetiklenisinde OddsPapi kotasi yakiyordu ve
  # artik kullanilmayan bir kaynagi cekiyordu: Betwinner istendiginde OddsPapi 22bet
  # anahtarli veri donduruyor, tarayici ise artik betwinner.com'un kendi feed'ini okuyor
  # (fetch-betwinner.yml). Bu workflow yalnizca manuel dispatch ile, karsilastirma veya
  # OddsPapi tarafini yeniden test etmek icin calisir.

permissions:
  contents: write

concurrency:
  group: fetch-odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        env:
          KEY: ${{ secrets.ODDSPAPI_KEY }}
          T: ${{ inputs.tournaments || '34480' }}
          BOOK: ${{ inputs.book || 'betwinner' }}
        run: |
          set -uo pipefail
          BASE="https://api.oddspapi.io/v4/odds-by-tournaments"
          mkdir -p data

          # Payload'daki kitap anahtarlarini TAM parse ile bulur.
          # Not: '"bookmakerOdds":{"..."' grep'i sadece ILK anahtari yakalar, ikinci bir
          # kitap anahtarini sessizce kacirir — dosya adi buna bagli oldugu icin
          # guvenilir bir parse sart.
          cat > /tmp/books.py <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
          except Exception:
              data = None
          books = set()
          for fx in (data if isinstance(data, list) else []):
              books.update((fx.get("bookmakerOdds") or {}).keys())
          print("%s|%d" % (" ".join(sorted(books)), len(data) if isinstance(data, list) else 0))
          PY

          URL="${BASE}?bookmaker=${BOOK}&tournamentIds=${T}&apiKey=${KEY}"
          SLUG=$(echo "$T" | tr ',' '-')
          TMP="$(mktemp)"

          CODE=$(curl -sS -o "$TMP" -w "%{http_code}" -H "Accept: application/json" "$URL")
          echo "HTTP ${CODE}"
          if [ "$CODE" != "200" ]; then
            # Hata govdesi kitap verisi degil; adinda ISTENEN slug'i tasir.
            OUT="data/error-${BOOK}_${SLUG}.json"
            mv "$TMP" "$OUT"
            echo "Veri YOK (HTTP ${CODE}) -> ${OUT}. Govde:"; head -c 400 "$OUT"; echo ""
            exit 1
          fi
          python3 -m json.tool "$TMP" > /dev/null || { echo "Bozuk JSON"; exit 1; }

          INFO=$(python3 /tmp/books.py "$TMP")
          FOUND="${INFO%%|*}"
          FX="${INFO##*|}"
          # Dosya adi DONEN kitaba gore verilir, istenen slug'a gore degil.
          if [ -z "$FOUND" ]; then
            OUT="data/empty_${SLUG}.json"
          else
            OUT="data/$(echo "$FOUND" | tr ' ' '+')_${SLUG}.json"
          fi
          mv "$TMP" "$OUT"

          echo "Istenen kitap: ${BOOK} | Donen kitap: ${FOUND:-<yok>} | fixture: ${FX}"
          echo "Yazilan dosya: ${OUT}"
          echo " ${FOUND} " | grep -q " ${BOOK} " \
            && echo "✓ ${BOOK} dondu" \
            || echo "✗ ${BOOK} istendi ama farkli dondu — kapsamda degil"

      - name: Commit
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "fetch: ${{ inputs.book || 'betwinner' }} ${{ inputs.tournaments }}" \
            || echo "degisiklik yok"
          git push || echo "push atlandi"
