name: fetch-odds

# Betwinner oranlarini ceker ve data/ altina JSON yazar.
# Once probe-odds ile Betwinner'in kapsamda oldugunu DOGRULA. Kapsamda degilse bu
# workflow bos/400 doner.
#
# KURULUM:
#   Secret: ODDSPAPI_KEY  (Settings > Secrets and variables > Actions)
#   Yol:    .github/workflows/fetch-odds.yml
#   Calistir: Actions > fetch-odds > Run workflow

on:
  workflow_dispatch:
    inputs:
      tournaments:
        description: "Turnuva ID(leri), virgulle: 34480 veya 34480,390,325"
        required: true
        default: "34480"
      book:
        description: "Bookmaker slug"
        required: false
        default: "betwinner"
  schedule:
    - cron: "0 */6 * * *"   # 6 saatte bir; gerekmiyorsa sil

permissions:
  contents: write

concurrency:
  group: fetch-odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        env:
          KEY: ${{ secrets.ODDSPAPI_KEY }}
          T: ${{ inputs.tournaments || '34480' }}
          BOOK: ${{ inputs.book || 'betwinner' }}
        run: |
          set -uo pipefail
          BASE="https://api.oddspapi.io/v4/odds-by-tournaments"
          mkdir -p data
          URL="${BASE}?bookmaker=${BOOK}&tournamentIds=${T}&apiKey=${KEY}"
          OUT="data/${BOOK}_$(echo "$T" | tr ',' '-').json"

          CODE=$(curl -sS -o "$OUT" -w "%{http_code}" -H "Accept: application/json" "$URL")
          echo "HTTP ${CODE} -> ${OUT}"
          if [ "$CODE" != "200" ]; then
            echo "Veri YOK (HTTP ${CODE}). Govde:"; head -c 400 "$OUT"; echo ""
            exit 1
          fi
          python3 -m json.tool "$OUT" > /dev/null || { echo "Bozuk JSON"; exit 1; }

          FOUND=$(grep -o '"bookmakerOdds":{"[a-z0-9_.-]*"' "$OUT" \
                  | sed 's/.*{"//;s/"//' | sort -u | tr '\n' ' ')
          FX=$(grep -o '"fixtureId"' "$OUT" | wc -l)
          echo "Donen kitap: ${FOUND:-<yok>} | fixture: ${FX}"
          echo " ${FOUND} " | grep -q " ${BOOK} " \
            && echo "✓ ${BOOK} dondu" \
            || echo "✗ ${BOOK} istendi ama farkli dondu — kapsamda degil"

      - name: Commit
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "fetch: ${{ inputs.book || 'betwinner' }} ${{ inputs.tournaments }}" \
            || echo "degisiklik yok"
          git push || echo "push atlandi"
