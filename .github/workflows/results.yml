name: results

# Gunun kombinesindeki bacaklari sonuclandirir ve platform sayfalarini tazeler.
#
# NEDEN SAAT BASI: bir bahis bittigi anda sonucu bellidir, ertesi gun degil. Canli izleyici
# maci biter bitmez kaydediyor, flashscore feed'i ~570 futbol macini gun icinde tasiyor ve
# tennisexplorer ayni gunun setlerini yayinliyor. Notlandirilacak sey saatler once hazir
# oluyor; bu is onu okuyor.
#
# Butun bacaklar sonuclanmadan kombine "beklemede" kalir (tools/grade_combine.py); yeni
# bir kombine URETMEZ, sadece data/combine_log.jsonl'deki settlement alanini doldurur.
#
# KUPON KODU DA BURADA SAAT BASI TAZELENIR (tools/refresh_combine.py). Kod gunun
# TEK seferlik cekiminde basiliyor (combine.yml), ama kitap bir bacak baslar baslamaz
# kuponu FILTRELEMIYOR, yeniden KURUYOR — sabah dogrulanmis bir kombine, ogleye dogru
# baslamis bacaklari eksik ya da varsayilan bahis turunde bir kupona donusuyor. Bu adim
# combine.json'daki gunun bacaklarini aliyor, baslamis olanlari cikariyor ve kalanlar
# icin kitaptan yeni bir kod istiyor — combine.json'i yeniden yazar, data/combine_log.
# jsonl'e dokunmaz (secim kaydi kalici, kupon kodu degil).
#
# Depo public, Actions dakikasi sinirsiz; maliyeti olan tek sey kaynaklara giden istek ve
# o da saatte bir sweep.

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Settle graded combines
        run: python3 tools/grade_combine.py || echo "kombine notlandirma atlandi"

      - name: Refresh the bet-slip code from legs that have not started
        run: python3 tools/refresh_combine.py --input combine.json
             || echo "kupon tazelenemedi — kombine etkilenmedi"

      - name: Rebuild the combine-platform pages
        run: python3 tools/make_platform_pages.py || echo "platform sayfalari uretilemedi"

      - name: Commit
        if: always()
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PLATFORM_PAGES="combine.html referee.html dataquality.html scanned.html \
            rejected.html combine_history.html combine_results.html lab.html \
            calibration.html model_versions.html proposed_changes.html \
            source_health.html runs.html settings.html"
          git add combine.json data/combine_log.jsonl $PLATFORM_PAGES || true
          if git diff --cached --quiet; then
            echo "yeni sonuc yok"
            exit 0
          fi
          git commit -m "results: $(date -u +%Y-%m-%d) sonuclari"
          # Gunluk is ve canli izleyici de ayni dala yaziyor; rebase ile carpismayi onle.
          # Basarisiz bir rebase repoyu yarim birakiyor, o yuzden tekrar denemeden ONCE
          # abort etmek gerekiyor — abort olmadan ikinci ve ucuncu deneme de ayni yerde
          # takiliyordu, yani uc deneme aslinda birdi.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            git fetch origin main && git reset --hard origin/main
            sleep $((i * 5))
            # Notlandirma tamamen depodan yeniden turetilebiliyor: data/combine_log.jsonl'
            # daki secim alanlari degil, yalnizca settlement alani yeniden turetiliyor.
            # Kupon tazeleme de ayni sekilde saf: combine.json'daki secimlerden yeniden
            # hesaplaniyor, hicbir yeni bilgi tasimiyor.
            python3 tools/grade_combine.py >/dev/null 2>&1 || true
            python3 tools/refresh_combine.py --input combine.json >/dev/null 2>&1 || true
            python3 tools/make_platform_pages.py >/dev/null 2>&1 || true
            git add combine.json data/combine_log.jsonl $PLATFORM_PAGES || true
            git diff --cached --quiet && exit 0
            git commit -m "results: $(date -u +%Y-%m-%d) sonuclari (yeniden islendi)"
          done
          echo "push basarisiz — bir sonraki calistirma yakalar (notlandirma yeniden turetilebilir)"
