name: watch-live

# Canli izleyici: kitabin KENDI canli akisindan biten maclari kaydeder.
#
# NEDEN: Her sonuc kaynagi bugune kadar baskasinindi ve her biri tek bir dilimi
# kapsiyordu — football-data futbolu, EuroLeague basketbolu, Setka ise sadece Setka Cup'i.
# Masa tenisi kartinin %58'i (Pro League, TT-Cup, Masters) hicbir arsivde yoktu; voleybol,
# snooker, dart, hentbol ve futsalin ise hic kaynagi yoktu. Aday kaynaklarin bir kismi
# robots.txt'te bizim ajan adimiza kapali ve bu degismeyecek.
#
# Kitap bu maclarin hepsini kendisi oynatiyor ve skoru oynanirken yayinliyor. Bu is akisi
# LiveFeed'i tarar, her fikstürün son skorunu hatirlar ve mac bittiginde (ya akis "Match
# finished" dedigi icin ya da fikstür akistan dustugu icin) sonucu data/results/ altina
# yazar. tools/collect_live.py neyi kaydetmeyi REDDETTIGINI aciklar.
#
# CADENCE OLCULDU, TAHMIN EDILMEDI. 15 dakika boyunca 51 saniyede bir tarayip biten
# maclarin akista NE KADAR KALDIGINA baktim: 274 fikstürün 36'si dustu ve biten bir mac
# akista ~50-150 saniye duruyor. Yani yakalama sansi kabaca (kalma suresi / tarama
# araligi): dakikada bir tarama neredeyse hepsini, saatte bir taramaysa ~%2'sini yakalar.
# Kapsam tarama SURESIYLE orantili, tarama SAYISIYLA degil.
#
# Bu yuzden saat basi 55 dakikalik pencere aciliyor — gunde ~22 saat kesintisiz izleme.
# Onceki hali gunde 4 x 10 dakikaydi ve tek nedeni deponun private olmasiydi: aylik 2.000
# dakikalik kota gunde ~40 dakikadan fazlasina izin vermiyordu.
#
# GERCEK VERIM, iki tam kosudan olculdu: kosu basina ~43 sonuc, gunde ~1.000. Masa tenisi
# ~490, futbol ~130, voleybol ~120, e-spor ~60. (Ilk tahminim gunde 3.600'du; en yogun
# saatin en yogun dakikasindan genellenmisti ve uc kat yanlisti.) Voleybolun 400 sonucluk
# esigi bu hizla ~4 gun. Gunluk kapsam raporu bu hesabi data/watch_log.jsonl uzerinden
# spor spor kendisi yapiyor ve kac gun kaldigini yaziyor.
#
# Saat basi ayri is, tek uzun is degil: durum her taramada diske, ama repoya ancak is
# bitince yaziliyor, o yuzden bir cokme en fazla bir saat kaybettiriyor.

# ZAMANLAMA GUVENILIR DEGIL, ve bu olculdu: cron "4 * * * *" olarak kuruldugunda uc
# saatlik dilimden yalnizca biri ateslendi (22:04 ve 00:04 hic calismadi, 23:04 ise uc
# dakika gecikmeli). GitHub zamanlanmis isleri "en iyi gayret" ile calistiriyor ve saat
# basina yakin dakikalar en kalabalik olanlar. Iki onlem:
#   1. Dakika 37 — herkesin kullandigi :00-:10 araligindan uzak.
#   2. Is UZUN: her calistirma ~3 saat izliyor. Boylece dusen bir tetikleme bosluk
#      yaratmiyor, cunku zaten calisan bir is var; tek bir basarili tetikleme uc saat
#      kapsiyor. concurrency ayni anda ikinci bir isin baslamasini zaten engelliyor.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Her dilimin uzunlugu, dakika (0 = tek tarama)"
        required: false
        default: "55"
      slices:
        description: "Kac dilim (her dilim sonunda commit edilir)"
        required: false
        default: "3"
      every:
        description: "Taramalar arasi saniye (olculen kalma suresi ~50-150 sn)"
        required: false
        default: "60"
      sports:
        description: "Sadece bu spor idleri (virgullu), bos = izleme listesinin tamami"
        required: false
        default: ""

permissions:
  contents: write

# Ayni anda iki tarama calisirsa ikisi de ayni fikstürü 'kayboldu' sanabilir ve durum
# dosyasi birbirinin uzerine yazar.
concurrency:
  group: watch-live
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 3 x 55 dakika + commit paylari. GitHub'in ust siniri 360 dakika.
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4

      # UZUN IS, AMA SAATLIK COMMIT. Tek bir 3 saatlik tarama, cokerse uc saatlik
      # toplamayi birden goturur — izlenmis bir sonuc tekrar izlenemez, mac bitti. Bu
      # yuzden is dilimlere bolunmus: her dilim ~55 dakika tariyor, modelleri tazeliyor ve
      # sonuclari itiyor. Boylece dusen bir zamanlama bosluk yaratmiyor (is zaten
      # calisiyor) ve bir cokme en fazla bir dilim kaybettiriyor.
      - name: Sweep the live feed, committing after every slice
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_slice() {
            git add data/results data/models data/live_state.json data/watch_log.jsonl || true
            if git diff --cached --quiet; then
              echo "  degisiklik yok"
              return 0
            fi
            # Kendi satirlarimizin kopyasi: cakisma olursa uzak duruma YENIDEN isliyoruz.
            # "Bir sonraki kosu yakalar" burada dogru degil — bir sonraki kosu temiz bir
            # kaptan origin/main ile basliyor ve gonderilemeyen satirlar kayboluyor.
            rm -rf /tmp/bwsave && mkdir -p /tmp/bwsave && cp -r data/results /tmp/bwsave/
            git commit -q -m "results: live sweep $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              if git pull --rebase -q origin main && git push -q; then return 0; fi
              git rebase --abort 2>/dev/null || true
              git fetch -q origin main && git reset --hard -q origin/main
              python3 tools/merge_store.py /tmp/bwsave/results || true
              for S in $(git diff --name-only -- data/results \
                          | sed -n 's#data/results/\([0-9]*\)\.jsonl#\1#p'); do
                python3 tools/build_generic_model.py --sport "$S" >/dev/null 2>&1 || true
              done
              git add data/results data/models || true
              git diff --cached --quiet && return 0
              git commit -q -m "results: live sweep $(date -u +%Y-%m-%dT%H:%MZ) (yeniden islendi)"
              sleep $((i * 5))
            done
            echo "  push basarisiz — satirlar bu kapla birlikte gidecek"
            return 0
          }

          SLICES="${{ github.event.inputs.slices || '3' }}"
          for N in $(seq 1 "$SLICES"); do
            echo "=== dilim $N/$SLICES"
            python3 tools/collect_live.py \
              --minutes "${{ github.event.inputs.minutes || '55' }}" \
              --every "${{ github.event.inputs.every || '60' }}" \
              --sports "${{ github.event.inputs.sports || '' }}" || true
            for S in $(git diff --name-only -- data/results \
                        | sed -n 's#data/results/\([0-9]*\)\.jsonl#\1#p'); do
              python3 tools/build_generic_model.py --sport "$S" >/dev/null 2>&1 \
                || echo "  spor $S icin model kurulamadi"
            done
            commit_slice
          done
