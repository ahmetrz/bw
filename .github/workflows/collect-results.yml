name: collect-results

# Sonuc toplayici: biten masa tenisi maclarini biriktirir.
#
# NEDEN AYRI VE SIK: Setka'nin skor tablosu ~19 maclik DONEN bir pencere, arsiv degil.
# Gunde bir kez yoklamak gunde ~15 mac demek; kalibrasyon icin gereken ~400 mac bir ayi
# bulur. Iki saatte bir yoklayinca ayni is birkac gunde biter.
#
# Bu bir RAPOR degil, altyapi — gunluk analiz yine gunde 1 kez calisiyor (daily.yml).
# Maliyet ihmal edilebilir: kimlik gerektirmeyen tek bir GET, calisma basina ~20 saniye.
# robots.txt tum ajanlara acik (Allow: /).

on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-results
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect settled table tennis results
        run: python3 tools/collect_tt.py --out data/tt_results.jsonl

      # Arsivi genislet. Harvester her kosuda DAHA ONCE SORULMAMIS ciftlere butcesini
      # harciyor (data/tt_pairs_seen.json), yani zamanlanmis calismak arsivi tekrar
      # okumak yerine genisletiyor. Ciftler derece komsulari arasindan seciliyor:
      # bu devrelerde birbiriyle oynayan oyuncular onlar.
      - name: Widen the table tennis archive
        run: |
          python3 tools/harvest_tt_history.py \
            --pairs 2500 --pool 2032 --neighbours 10 --workers 8 \
            || echo "arsiv genisletilemedi"

      - name: Refresh the table tennis results store and model
        run: |
          python3 tools/collect_results.py --source setka || echo "toplama atlandi"
          python3 tools/build_generic_model.py --sport 10 || echo "model kurulamadi"

      - name: Commit
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tt_results.jsonl data/tt_history.jsonl data/tt_pairs_seen.json \
            data/results/10.jsonl data/models/10.json || true
          if git diff --cached --quiet; then
            echo "yeni sonuc yok"
            exit 0
          fi
          git commit -m "results: table tennis $(date -u +%Y-%m-%dT%H:%MZ)"
          # Toplayici sik calisiyor ve gunluk is de ayni dala yaziyor; rebase ile carpismayi onle.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "push basarisiz — bir sonraki calistirma yakalar"
