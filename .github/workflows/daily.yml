name: daily

# Gunluk analiz: onumuzdeki 24 ve 48 saat icinde baslayan mac-oncesi bahisler,
# model yonu + guvenlik merdiveni + 1.10 esigi, sonuc Telegram'a.
#
# Cadence operator tarafindan onaylandi (CLAUDE.md HITL 5): gunde 1 kez.
# 06:10 UTC = Turkiye saatiyle 09:10. Aksam kartinin tamami acik olur ve
# 24 saatlik pencere gunun maclarini kapsar.
#
# GEREKEN SECRET'LAR (yoksa tarama yine calisir, sadece bildirim atlanir):
#   TELEGRAM_BOT_TOKEN   @BotFather'dan alinan token
#   TELEGRAM_CHAT_ID     mesajin gidecegi sohbet id'si

on:
  # UC DENEME, CUNKU BIR TANESI YETMIYOR. GitHub zamanlanmis isleri "en iyi gayret" ile
  # calistiriyor ve bugun 06:10 hic ateslenmedi — elle tetiklemeseydim gunun listesi hic
  # gitmeyecekti. Saat basina yakin dakikalar platformun en kalabalik dilimleri, o yuzden
  # hem dakika 43'e tasindi hem de iki yedek eklendi.
  #
  # Yedekler --only-if-new ile calisiyor: ilk kosu basarili olduysa butun secimler zaten
  # tahmin gunlugunde olur, yedek de gondermez. Ayni kart icin iki bildirim cikmaz.
  schedule:
    - cron: "43 6 * * *"
    - cron: "43 7 * * *"
    - cron: "43 8 * * *"
  workflow_dispatch:
    inputs:
      windows:
        description: "Pencereler (saat, virgullu)"
        required: false
        default: "24,48"
      max_fixtures:
        description: "Mac ust siniri (0 = sinirsiz)"
        required: false
        default: "0"
      dry_run:
        description: "true = Telegram'a gonderme, sadece yazdir"
        required: false
        default: "false"
      use_committed_card:
        description: "true = yeni cekim yapma, repodaki karti kullan"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Kimlik bilgilerini ONCE dogrula. Bozuk bir token'in 2 saatlik cekimden SONRA
      # ortaya cikmasi, raporun gidecek yeri olmadigini en gec ogrenmek demektir.
      # Token yoksa sorun degil (0 doner, tarama devam eder); token VARSA ve
      # calismiyorsa is burada durur.
      - name: Check Telegram credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tools/telegram_ping.py --quiet

      # 48 saatlik pencereyi bir kez cekiyoruz; 24 saatlik pencere onun alt kumesi,
      # ikinci bir cekim gereksiz yuk olur.
      #
      # NE CEKILMEDIGI DE ONEMLI. Cekici artik iki kurali fikstür listesini okurken
      # uyguluyor, her fikstür icin binlerce marketi cektikten SONRA degil:
      #   * config.EXCLUDED_SPORTS — canli kartta 750 fikstür, cogunlugu loto.
      #   * sert kural 7, "ikinci taraf yoksa ikili karsilasma degildir" — 311 fikstür,
      #     her at yarisi ve tazi yarisi dahil.
      # Ikisi de zaten yururlukteydi; sadece pahali kisimdan once uygulaniyor. Ust oyunlar
      # (devre, korner, "ilk olan") ise --sub-games ile opsiyonel: gunluk urunde hicbir
      # sey onlari okumuyor, ama gercek bir kartta satirlarin %54'uydu.
      - name: Fetch 48h window
        if: inputs.use_committed_card != 'true'
        env:
          MF: ${{ inputs.max_fixtures || '0' }}
        run: |
          set -o pipefail
          mkdir -p data
          python3 tools/fetch_window.py \
            --hours 48 \
            --partner 159 \
            --max-fixtures "${MF}" \
            --workers 8 \
            --budget-min 45 \
            --out data/betwinner_daily.json.gz
          ls -la data/

      # Bir defalik: repoda duran karti kullan (yeni cekim beklemeden bugunun listesi).
      - name: Use committed card
        if: inputs.use_committed_card == 'true'
        run: cp data/card_today.json.gz data/betwinner_daily.json.gz

      - name: Analyse and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          W: ${{ inputs.windows || '24,48' }}
          DRY: ${{ inputs.dry_run || 'false' }}
          SCHED: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          FLAG=""
          if [ "${DRY}" = "true" ]; then FLAG="--no-telegram"; fi
          # Hangi cron'un atesledigini github.event.schedule soyluyor; elle tetiklemede
          # bos gelir. Gunun ILK zamanlanmis kosusu (06:43) her zaman gonderir, 07:43 ve
          # 08:43 yedekleri ancak ondan once bir kosu olmadiysa gonderir.
          case "${SCHED}" in
            "43 7 * * *"|"43 8 * * *") FLAG="${FLAG} --only-if-new" ;;
          esac
          python3 tools/daily_report.py \
            --input data/betwinner_daily.json.gz \
            --windows "${W}" \
            --out daily_report.json \
            --page picks.html \
            ${FLAG}

      # FUTBOL+TENIS KOMBINE PLATFORMU. Ayni AYNI is icinde, ayni indirilmis karttan
      # (data/betwinner_daily.json.gz) calisir — ikinci bir Betwinner cekimi yapmaz.
      # Ayri urun (docs/DECISIONS/0001, 0003): kendi 80 puanlik guven esigi, kendi hakem
      # kurulu, kendi coklu-amacli secimi var; ustteki gunluk secim listesini etkilemez.
      - name: Install PDF dependencies
        run: pip install --quiet -r requirements.txt

      - name: Build the football+tennis combine
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          CFLAG=""
          case "${SCHED}" in
            "43 7 * * *"|"43 8 * * *") CFLAG="--only-if-new" ;;
          esac
          python3 tools/daily_combine.py \
            --input data/betwinner_daily.json.gz \
            --out combine.json \
            --log data/combine_log.jsonl \
            ${CFLAG}

      - name: Render the combine PDF report
        run: python3 tools/make_pdf_report.py --input combine.json --out combine_report.pdf
             || echo "PDF uretilemedi — sayfa yine de yayinlanir"

      # Sonuc deposunu ve modelleri her gun tazele. Adapter basina birkac saniye;
      # yeni sonuclar geldikce dereceler ve kalibrasyon kendiliginden guncellenir.
      - name: Refresh the results store and rebuild every model
        run: |
          python3 tools/collect_results.py --all || echo "toplama kismen basarisiz"
          python3 tools/build_generic_model.py --all || echo "model kurulamadi"

      - name: Grade yesterday's predictions
        run: python3 tools/grade_predictions.py || echo "notlandirma atlandi"

      # Yontem sayfasi koddan uretiliyor, elle yazilmiyor: bir esletirme ya da bir
      # sinyalin durumu degisirse sayfa da degisir. Gunluk uretmek onu taze tutar.
      - name: Build the method page
        run: python3 tools/make_method_page.py --out method.html || echo "yontem sayfasi uretilemedi"

      # Kombine platformunun kendi gunlukleri: dunku kombinelerin sonuclanip
      # sonuclanmadigini kontrol eder (tools/grade_predictions.py'nin kombine karsiligi),
      # kaynak saglik durumunu tazeler (ayri, sik calisan pahali bir is olmasin diye
      # buraya entegre edildi — bolum 21.4), ve 14 yeni ekrani coder.
      - name: Settle graded combines
        run: python3 tools/grade_combine.py || echo "kombine notlandirma atlandi"

      - name: Check data source health
        run: python3 tools/check_source_health.py || echo "kaynak saglik kontrolu atlandi"

      - name: Build the combine-platform pages
        run: python3 tools/make_platform_pages.py || echo "platform sayfalari uretilemedi"

      # NOT: coupon.html artik gunluk kostan uretilmiyor. O sayfa taramanin
      # "kitap-ici ucuzluk" siralamasini gosteriyordu; gunluk urun ise model yonu +
      # guvenlik merdiveni. Ayni kosuda iki farkli siralamayla iki HTML uretmek,
      # hangisinin urun oldugunu belirsizlestiriyordu. Tarama yolu icin arac duruyor:
      #   python3 tools/make_coupon.py --input <kart> --hours 48 --legs 50

      - name: Commit
        if: always()
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ham cekim repoya girmiyor; sadece rapor, secim sayfasi ve tahmin gunlugu.
          # data/simulated_leagues.json burada uretiliyor ve canli izleyici onu okuyor:
          # uretilmis fikstür deseni ancak butun bir kartta gorunur, iki dakikalik bir
          # taramada gorunmez. Commit edilmezse izleyici hicbir zaman ogrenemez.
          #
          # Kombine platformunun kendi ciktilari da ayni satirda: combine.json/PDF,
          # data/combine_log.jsonl (kombine urunun tahmin gunlugu karsiligi) ve 14 yeni
          # ekran. data/models/history/ zaten "data/models" altinda, ayrica eklenmiyor.
          PLATFORM_PAGES="combine.html referee.html dataquality.html scanned.html \
            rejected.html combine_history.html combine_results.html lab.html \
            calibration.html model_versions.html proposed_changes.html \
            source_health.html runs.html settings.html"
          git add daily_report.json picks.html method.html data/predictions.jsonl \
            data/scoreboard.json data/simulated_leagues.json data/results data/models \
            combine.json combine_report.pdf data/combine_log.jsonl \
            data/proposed_changes.jsonl data/source_health.json $PLATFORM_PAGES \
            || true
          git commit -m "daily: $(date -u +%Y-%m-%d) analizi" || echo "degisiklik yok"

          # BU KOSUNUN CIKTISI YENIDEN URETILEMEZ. picks.html ve daily_report.json her gun
          # yeniden kurulabilir, ama data/predictions.jsonl kurulamaz: tahmin, SEÇİM
          # YAPILDIĞI ANDA, o anda gecerli oranla yaziliyor ve sonradan yeniden yazilan bir
          # kayit "ne secerdik"in kaydi olur — backtest'in kendini kandirma bicimi. Canli
          # izleyici artik saat basi ayni dala yaziyor, yani carpisma nadir degil.
          #
          # Bu yuzden tek deneme yetmez. Cakisirsak uzak durumu aliyoruz ve SADECE BIZE AIT
          # dosyalari geri koyuyoruz; data/results ve data/models izleyicinin, onlari
          # oldugu gibi birakiyoruz.
          MINE="daily_report.json picks.html method.html data/predictions.jsonl \
                data/scoreboard.json data/simulated_leagues.json \
                combine.json combine_report.pdf data/combine_log.jsonl \
                data/source_health.json $PLATFORM_PAGES"
          rm -rf /tmp/bwdaily && mkdir -p /tmp/bwdaily
          for f in $MINE; do
            [ -f "$f" ] && install -D "$f" "/tmp/bwdaily/$f"
          done
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push; then
              echo "push tamam"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main && git reset --hard origin/main
            for f in $MINE; do
              [ -f "/tmp/bwdaily/$f" ] && install -D "/tmp/bwdaily/$f" "$f"
            done
            git add $MINE || true
            if git diff --cached --quiet; then
              echo "uzak durumda zaten var"
              exit 0
            fi
            git commit -m "daily: $(date -u +%Y-%m-%d) analizi (yeniden islendi)"
            sleep $((i * 5))
          done
          echo "push basarisiz — BUGUNUN TAHMIN KAYDI KAYIP, isabet olcumu bir gun eksik"
