name: combine

# GUNLUK FUTBOL+TENIS KOMBINE PLATFORMU — TEK URUN (docs/PRODUCT_VISION.md,
# docs/ARCHITECTURE.md, docs/DECISIONS/0007). Eski cok sporlu tarayici ve gunluk liste
# urunu (scan.py, tools/daily_report.py, daily.yml) kaldirildi; bu is artik tek gunluk
# calisma.
#
# HEDEF 07:00 ISTANBUL = 04:00 UTC (Turkiye 2016'dan beri sabit UTC+3, DST yok). Birincil
# tetikleyici 04:43 UTC (07:43 Istanbul) — ":00" degil ":43", cunku GitHub'in zamanlanmis
# isleri "en iyi gayret" ile calisiyor ve saat basina yakin dakikalar en kalabalik
# dilimler (watch-live.yml'de olculdu: "4 * * * *" kurulunca uc saatlik dilimden yalnizca
# biri ateslendi). Iki yedek, --only-if-new ile: ilk kosu basarili olduysa butun kart
# zaten data/combine_log.jsonl'de olur, yedekler yeniden yazmaz.
#
# GEREKEN SECRET'LAR (yoksa is yine calisir, sadece bildirim atlanir):
#   TELEGRAM_BOT_TOKEN   mevcut bot — gunluk liste urunuyle AYNI kanal, ikinci bir kurulum
#   TELEGRAM_CHAT_ID     gerekmedi (docs/DECISIONS/0007)

on:
  schedule:
    - cron: "43 4 * * *"
    - cron: "43 5 * * *"
    - cron: "43 6 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Analiz penceresi (saat)"
        required: false
        default: "24"
      dry_run:
        description: "true = kupon kodu istenmesin (Betwinner API'sine yazmaz)"
        required: false
        default: "false"
      use_committed_card:
        description: "true = yeni cekim yapma, repodaki karti kullan"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: combine
  cancel-in-progress: false

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Kimlik bilgilerini ONCE dogrula. Bozuk bir token'in cekimden SONRA ortaya cikmasi,
      # gunun kombinesinin gidecegi yeri olmadigini en gec ogrenmek demektir. Token yoksa
      # sorun degil (0 doner, is devam eder); token VARSA ve calismiyorsa is burada durur.
      - name: Check Telegram credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tools/telegram_ping.py --quiet

      - name: Install PDF dependency
        run: pip install --quiet -r requirements.txt

      # Kendi 24 saatlik penceresini kendi cekiyor (docs/DECISIONS/0006). Futbol+tenis
      # disindaki sporlar da cekilir (fetch_window.py zaten butun karti ceker),
      # combine.py zaten kendi icinde config.COMBINE_SPORTS'a daraltiyor — burada sport
      # filtresi uygulamaya gerek yok.
      - name: Fetch 24h window
        if: inputs.use_committed_card != 'true'
        env:
          H: ${{ inputs.hours || '24' }}
        run: |
          set -o pipefail
          mkdir -p data
          python3 tools/fetch_window.py \
            --hours "${H}" \
            --partner 159 \
            --workers 8 \
            --budget-min 30 \
            --out data/betwinner_combine.json.gz
          ls -la data/

      - name: Use committed card
        if: inputs.use_committed_card == 'true'
        run: cp data/card_today.json.gz data/betwinner_combine.json.gz

      - name: Build the football+tennis combine
        env:
          SCHED: ${{ github.event.schedule }}
          H: ${{ inputs.hours || '24' }}
        run: |
          set -o pipefail
          CFLAG=""
          case "${SCHED}" in
            "43 5 * * *"|"43 6 * * *") CFLAG="--only-if-new" ;;
          esac
          NOCOUPON=""
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then NOCOUPON="--no-coupon"; fi
          # BASARISIZLIK BU ADIMDA DURMAMALI — asagidaki notlandirma/saglik/sayfa
          # adimlari, bu kosuda kombine uretilemese bile calismali (bolum 13/21'in "bir
          # kaynagin basarisiz olmasi butun pipeline'i cokertmesin" kurali).
          python3 tools/daily_combine.py \
            --input data/betwinner_combine.json.gz \
            --hours "${H}" \
            --out combine.json \
            --log data/combine_log.jsonl \
            ${CFLAG} ${NOCOUPON} \
            || echo "kombine bu kosuda uretilemedi"

      - name: Render the combine PDF report
        run: python3 tools/make_pdf_report.py --input combine.json --out combine_report.pdf
             || echo "PDF uretilemedi — sayfa yine de yayinlanir"

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tools/notify_combine.py --input combine.json --pdf combine_report.pdf
             || echo "Telegram bildirimi atlandi"

      # SONUC DEPOSUNU VE MODELLERI HER GUN TAZELE — eski gunluk isin --all adimlarinin
      # yerini alan, futbol+tenisle SINIRLI hali. Bilerek KOMBINEDEN SONRA: bugunun
      # kombinesi hala DUNKU commit'te duran modelle kuruluyor, tazeleme bir sonraki
      # kosuya hazirlaniyor. Ayni kosuda kurup ayni kosuda kullanmak, o gunun kismi
      # verisindeki bir bozuklugun hemen o gun kullanilan modele sizmasi demek olurdu.
      - name: Refresh the results store and rebuild the football/tennis models
        run: |
          python3 tools/collect_results.py --all || echo "toplama kismen basarisiz"
          python3 tools/build_generic_model.py --sport 1 || echo "futbol modeli kurulamadi"
          python3 tools/build_generic_model.py --sport 4 || echo "tenis modeli kurulamadi"

      # Gunluk dongudekiler: dunku/bugunku kombinelerin sonuclanip sonuclanmadigini
      # kontrol eder (results.yml zaten saat basi yapiyor — bu bir yedek), kaynak saglik
      # durumunu tazeler (ayri, sik calisan pahali bir is olmasin diye buraya entegre
      # edildi — bolum 21.4), ve 14 ekrani yeniden uretir.
      - name: Settle graded combines
        run: python3 tools/grade_combine.py || echo "kombine notlandirma atlandi"

      - name: Check data source health
        run: python3 tools/check_source_health.py || echo "kaynak saglik kontrolu atlandi"

      - name: Build the combine-platform pages
        run: python3 tools/make_platform_pages.py || echo "platform sayfalari uretilemedi"

      - name: Commit
        if: always()
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ham cekim repoya girmiyor — sadece bu platformun kendi ciktilari: combine.json/
          # PDF, data/combine_log.jsonl, 14 ekran, kaynak saglik raporu, olasi yeni
          # oneriler, VE bu kosunun kendi tazeledigi sonuc deposu + futbol/tenis modelleri
          # (data/models/history/ "data/models" altinda, ayrica eklenmiyor).
          PLATFORM_PAGES="combine.html referee.html dataquality.html scanned.html \
            rejected.html combine_history.html combine_results.html lab.html \
            calibration.html model_versions.html proposed_changes.html \
            source_health.html runs.html settings.html"
          git add combine.json combine_report.pdf data/combine_log.jsonl \
            data/proposed_changes.jsonl data/source_health.json data/results data/models \
            $PLATFORM_PAGES || true
          git commit -m "combine: $(date -u +%Y-%m-%d) kombine" || echo "degisiklik yok"

          # Saat basi sonuc dongusu ve canli izleyici de ayni dala yaziyor; rebase ile
          # carpismayi onle (results.yml/watch-live.yml ile ayni desen). data/results ve
          # data/models MINE'da DEGIL: bu iki dosya grubu her gun WHOLE yeniden yaziliyor
          # (TROUBLESHOOTING.md), yani satir bazli bir rebase-merge guvenilir degil —
          # cakisirsak UZAK durumu aliyoruz (izleyicinin ya da bir onceki kosunun) ve bu
          # kosunun kendi refresh adimi zaten idempotent, bir sonraki kosuda yeniden yazar.
          MINE="combine.json combine_report.pdf data/combine_log.jsonl \
                data/source_health.json $PLATFORM_PAGES"
          rm -rf /tmp/bwcombine && mkdir -p /tmp/bwcombine
          for f in $MINE; do
            [ -f "$f" ] && install -D "$f" "/tmp/bwcombine/$f"
          done
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push; then
              echo "push tamam"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main && git reset --hard origin/main
            for f in $MINE; do
              [ -f "/tmp/bwcombine/$f" ] && install -D "/tmp/bwcombine/$f" "$f"
            done
            git add $MINE || true
            if git diff --cached --quiet; then
              echo "uzak durumda zaten var"
              exit 0
            fi
            git commit -m "combine: $(date -u +%Y-%m-%d) kombine (yeniden islendi)"
            sleep $((i * 5))
          done
          echo "push basarisiz — bir sonraki calistirma yakalar (kombine gunlugu yeniden turetilebilir degil, ama commit_slice deseninde oldugu gibi /tmp kopyasi bu is bitince kaybolur)"
