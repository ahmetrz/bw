name: telegram-test

# Telegram baglantisini dogrular ve tek bir onay mesaji gonderir.
# Saniyeler surer — gunluk isin 2 saatlik cekimini beklemeden secret'lari test etmek icin.
#
# Zamanlama YOK: yalnizca elle calistirilir.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send confirmation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tools/telegram_ping.py
